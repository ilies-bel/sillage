name: Check

# The gate for the rebuild (ARCHITECTURE.md §4, §5.J):
#   · typecheck the rebuilt tree
#   · the import-boundary rule — core pure, modules isolated, renderer sees contracts only
#   · the CRM containment grep — no VerySwing vocabulary outside modules/crm/vsa/
#   · the test suite
#
# `--ignore-scripts` on purpose. `postinstall` rebuilds the native audio module
# against Electron's ABI; none of that is needed to typecheck
# or to run the suite, because the rebuilt tree runs `.ts` directly under Node and
# stores through `node:sqlite` rather than a native module. Keeping the gate free
# of the native toolchain is what makes it fast enough to run on every push.

on:
  push:
    # Branches only. A tag points at a commit that was already pushed to a
    # branch, so `git tag v0.1.0 && git push --tags` used to run this whole
    # suite a second time against a SHA it had just finished checking — and the
    # concurrency group below cannot collapse those two, because they are
    # different refs. Cutting a release is the moment you least want the queue
    # full of duplicates.
    branches: ['**']
  pull_request:
  workflow_dispatch:

# One live run per ref. Pushing three times in a minute used to leave three full
# suites running; now the first two are cancelled the moment they are stale,
# which is the single biggest saving available here — the gate is cheap, but it
# is also the workflow that runs on literally every push.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The backstop, not the mechanism: `run-tests.mjs` passes `--test-timeout`
    # so a stuck test fails and *names itself*. This only catches a hang that
    # timeout cannot see — an npm install wedged on the network, a runner that
    # stops responding. Two runs reached GitHub's six-hour default before this
    # existed, having reported nothing at all.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck, boundaries, CRM containment
        run: npm run check

      # Bounded tighter than the job, and separately, so the log says *which*
      # phase stalled rather than only that the job was killed.
      - name: Test
        run: npm test
        timeout-minutes: 12

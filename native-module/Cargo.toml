
[package]
name = "sillage-audio"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.8.3", features = ["napi4"] }
napi-derive = "3.5.2"
cpal = "0.15.2"
# Pure-Rust port of WebRTC AEC3. Pinned exactly, and not by habit: the crate
# self-describes as a work in progress with an evolving API, and this build
# depends on undocumented behaviour of its high-pass filter stage — see the
# stage matrix and `diverges_without_the_high_pass_filter` in echo_canceller.rs.
# A bump is a measurement, not a version number.
aec3 = "=0.3.1"
ringbuf = "0.4"
anyhow = "1.0"
once_cell = "1.18.0"
rubato = "0.16"
webrtc-vad = "0.4"
# Zero-copy reinterpret of &[i16] as &[u8] for napi Buffer hand-off.
# Replaces a per-chunk per-sample to_le_bytes loop in the DSP hot path.
bytemuck = "1"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.11.10", features = ["ca", "cm", "av", "cat", "dispatch", "ns", "sc", "cf", "blocks", "objc"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.13.0"
windows = { version = "0.52.0", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading"] }
tracing = "0.1.44"
